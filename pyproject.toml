[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "houseprice"
version = "0.1.0"
description = "Linear regression from scratch with NumPy, trained on Excel files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "openpyxl>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
houseprice = "houseprice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
